# Database (MySQL). Values can be overridden with environment variables.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ecommerceapp}
spring.datasource.password=${DB_PASSWORD:ecommerceapp}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.data.rest.base-path=/api

# Frontend allowed to call the API (CORS)
app.allowed-origins=http://localhost:4200

# JWT: set JWT_SECRET (at least 32 characters) outside of local development
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-please-32-chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# First admin account, created at startup if it does not exist yet
app.admin.email=${ADMIN_EMAIL:admin@luv2shop.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
