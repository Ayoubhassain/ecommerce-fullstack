# In-memory database for tests: no MySQL needed
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-for-unit-tests-only-32chars-min
app.admin.email=admin@test.com
app.admin.password=AdminPass123
