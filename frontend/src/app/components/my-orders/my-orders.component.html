<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <h3 class="mb-4">My orders</h3>

      <div *ngIf="!loading && orders.length === 0" class="alert alert-info">
        You have not placed any order yet.
      </div>

      <table *ngIf="orders.length > 0" class="table table-bordered">
        <thead>
          <tr>
            <th>Date</th>
            <th>Tracking number</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>{{ order.dateCreated | date:'medium' }}</td>
            <td><code>{{ order.orderTrackingNumber }}</code></td>
            <td>{{ order.totalQuantity }}</td>
            <td>{{ order.totalPrice | currency:'USD' }}</td>
            <td><span class="badge bg-secondary">{{ order.status }}</span></td>
          </tr>
        </tbody>
      </table>

      <ngb-pagination *ngIf="totalElements > pageSize"
                      [(page)]="pageNumber" [pageSize]="pageSize" [collectionSize]="totalElements"
                      (pageChange)="load()"></ngb-pagination>
    </div>
  </div>
</div>
