<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <h3 class="mb-4">Log in</h3>

          <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email">
              <div *ngIf="form.controls.email.touched && form.controls.email.invalid" class="text-danger small">
                Enter a valid email.
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password">
              <div *ngIf="form.controls.password.touched && form.controls.password.invalid" class="text-danger small">
                Enter your password.
              </div>
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="loading">Log in</button>
            <p class="mt-3">No account yet? <a routerLink="/register">Create one</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
