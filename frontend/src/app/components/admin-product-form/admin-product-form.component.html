<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <h3 class="mb-4">{{ productId ? 'Edit product' : 'New product' }}</h3>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate style="max-width: 720px">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label" for="sku">SKU</label>
            <input id="sku" class="form-control" formControlName="sku">
            <div *ngIf="invalid('sku')" class="text-danger small">Required.</div>
          </div>
          <div class="col-md-8 mb-3">
            <label class="form-label" for="name">Name</label>
            <input id="name" class="form-control" formControlName="name">
            <div *ngIf="invalid('name')" class="text-danger small">Required.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="description">Description</label>
          <textarea id="description" class="form-control" rows="3" formControlName="description"></textarea>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label" for="unitPrice">Price</label>
            <input id="unitPrice" type="number" step="0.01" class="form-control" formControlName="unitPrice">
            <div *ngIf="invalid('unitPrice')" class="text-danger small">Must be greater than 0.</div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label" for="unitsInStock">Stock</label>
            <input id="unitsInStock" type="number" class="form-control" formControlName="unitsInStock">
            <div *ngIf="invalid('unitsInStock')" class="text-danger small">Cannot be negative.</div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label" for="categoryId">Category</label>
            <select id="categoryId" class="form-select" formControlName="categoryId">
              <option [ngValue]="null" disabled>Choose…</option>
              <option *ngFor="let category of categories" [ngValue]="category.id">{{ category.categoryName }}</option>
            </select>
            <div *ngIf="invalid('categoryId')" class="text-danger small">Choose a category.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="imageUrl">Image URL</label>
          <input id="imageUrl" class="form-control" formControlName="imageUrl" placeholder="assets/images/products/...">
        </div>

        <div class="form-check mb-4">
          <input id="active" type="checkbox" class="form-check-input" formControlName="active">
          <label class="form-check-label" for="active">Visible in the shop</label>
        </div>

        <button type="submit" class="btn btn-primary me-2" [disabled]="saving">Save</button>
        <a routerLink="/admin/products" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
