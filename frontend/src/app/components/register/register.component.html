<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <h3 class="mb-4">Create an account</h3>

          <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="firstName">First name</label>
                <input id="firstName" class="form-control" formControlName="firstName" autocomplete="given-name">
                <div *ngIf="form.controls.firstName.touched && form.controls.firstName.invalid" class="text-danger small">Required.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="lastName">Last name</label>
                <input id="lastName" class="form-control" formControlName="lastName" autocomplete="family-name">
                <div *ngIf="form.controls.lastName.touched && form.controls.lastName.invalid" class="text-danger small">Required.</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email">
              <div *ngIf="form.controls.email.touched && form.controls.email.invalid" class="text-danger small">Enter a valid email.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input id="password" type="password" class="form-control" formControlName="password" autocomplete="new-password">
              <div *ngIf="form.controls.password.touched && form.controls.password.invalid" class="text-danger small">At least 8 characters.</div>
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="loading">Create my account</button>
            <p class="mt-3">Already registered? <a routerLink="/login">Log in</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
