<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">

      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <h3 class="m-0">Admin · Orders</h3>
        <a routerLink="/admin/products" class="btn btn-outline-secondary">Products</a>
      </div>

      <div *ngIf="message" class="alert alert-info">{{ message }}</div>

      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>{{ order.dateCreated | date:'medium' }}</td>
            <td>{{ order.customerName }}<br><small class="text-muted">{{ order.customerEmail }}</small></td>
            <td>{{ order.totalQuantity }}</td>
            <td>{{ order.totalPrice | currency:'USD' }}</td>
            <td>
              <select class="form-select form-select-sm" [ngModel]="order.status"
                      (ngModelChange)="changeStatus(order, $event)">
                <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
              </select>
            </td>
          </tr>
          <tr *ngIf="orders.length === 0">
            <td colspan="5" class="text-center text-muted">No orders yet.</td>
          </tr>
        </tbody>
      </table>

      <ngb-pagination *ngIf="totalElements > pageSize"
                      [(page)]="pageNumber" [pageSize]="pageSize" [collectionSize]="totalElements"
                      (pageChange)="load()"></ngb-pagination>
    </div>
  </div>
</div>
